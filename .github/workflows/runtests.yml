name: Node CI
on:
  pull_request:
    branches:
      - dev
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Shim docker-compose to docker compose
        # ubuntu-latest runners no longer ship the docker-compose v1 binary;
        # the Makefile still invokes it by name. Forward to the preinstalled
        # Compose v2 plugin instead of rewriting every make target.
        run: |
          printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose > /dev/null
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version
      - name: npm install, build, and test
        env:
          POSTGRESQL_DATABASE: myra
          POSTGRESQL_DATABASE_TEST: myra_test
          POSTGRESQL_HOST: db
          POSTGRESQL_PORT: 5432

          PROJECT: myra_range
          ENVIRONMENT: development
          API_PORT: 8080
          BUILD_TARGET: base

          POSTGRESQL_PASSWORD: banana
          POSTGRESQL_USER: app_dv_myra

          SSO_URL: https://sso-dev.pathfinder.gov.bc.ca/auth/realms/range/protocol/openid-connect

          CI: true
        run: |
          echo "$(printenv)" > .env
          npm ci
          make local-test-setup
          make run-db-test
          make local-test
